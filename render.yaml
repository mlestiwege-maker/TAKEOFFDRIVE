services:
  - type: web
    name: takeoff-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: OTP_DEBUG_ECHO
        value: "false"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FIRST_ADMIN_EMAIL
        value: admin@takeoff.dev
      - key: FIRST_ADMIN_PASSWORD
        generateValue: true
      - key: CORS_ORIGINS
        value: '["http://localhost:5173"]' # update after the frontend is deployed — see DEPLOYMENT.md
      - key: DATABASE_URL
        fromDatabase:
          name: takeoff-db
          property: connectionString
      # Optional, set manually in the Render dashboard after first deploy:
      #   REDIS_URL          — shares rate limits across instances (falls back to
      #                         in-memory, fine for a single instance, without it)
      #   TWILIO_ACCOUNT_SID / TWILIO_AUTH_TOKEN / TWILIO_FROM_NUMBER — real SMS
      #   SMTP_HOST / SMTP_USERNAME / SMTP_PASSWORD / SMTP_FROM_EMAIL — real email
      #   S3_BUCKET_NAME / S3_REGION / AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
      #                         — durable document storage instead of local disk
    dockerCommand: sh start.sh

databases:
  - name: takeoff-db
    plan: free
    databaseName: takeoff_onboarding
    user: takeoff
